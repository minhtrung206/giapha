<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cây Phả Hệ Tộc Lê</title>
  
  <!-- Các thư viện cần thiết cho D3 Org Chart -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3"></script>
  <!-- Driver kết nối Neo4j -->
  <script src="https://cdn.jsdelivr.net/npm/neo4j-driver"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      overflow: hidden;
    }
    #status-msg {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      font-size: 15px;
      font-weight: 500;
      color: #1a365d;
      background: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid #cbd5e0;
    }
    .chart-container {
      width: 100vw;
      height: 100vh;
    }
    .node-card {
      background: #ffffff;
      border: 1.5px solid #2b6cb0;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .node-id {
      font-size: 11px;
      font-weight: bold;
      color: #718096;
      margin-bottom: 3px;
    }
    .node-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a202c;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div id="status-msg">Đang tải dữ liệu gia phả từ máy chủ...</div>
  <div class="chart-container" id="tree-container"></div>

  <script>
    const NEO4J_URI = "neo4j+s://c8d22f23.databases.neo4j.io";
    const NEO4J_USERNAME = "c8d22f23";
    const NEO4J_PASSWORD = "qsrjpGHpJ5RWSgiJV0_C45jiWUPC1HeSswk_hwokHxo";
    const NEO4J_DATABASE = "c8d22f23";

    async function loadFamilyTree() {
      const statusEl = document.getElementById("status-msg");
      const driver = neo4j.driver(NEO4J_URI, neo4j.auth.basic(NEO4J_USERNAME, NEO4J_PASSWORD));
      const session = driver.session({ database: NEO4J_DATABASE });

      try {
        const cypherQuery = `
          MATCH (p:Person)
          WHERE p.id STARTS WITH '1' AND NOT p.id ENDS WITH 'A' AND NOT p.id ENDS WITH 'B'
          OPTIONAL MATCH (p)-[:VO_CHONG]->(sp:Person)
          OPTIONAL MATCH (parent:Person)-[:CHA_ME_CON]->(p)
          WHERE parent.id STARTS WITH '1' AND NOT parent.id ENDS WITH 'A' AND NOT parent.id ENDS WITH 'B'
          RETURN p.id AS id,
                 parent.id AS parentId,
                 p.name AS personName,
                 sp.name AS spouseName
          ORDER BY p.id;
        `;

        const result = await session.run(cypherQuery);
        
        const nodeMap = new Map();
        result.records.forEach(r => {
          const id = r.get("id");
          const parentId = r.get("parentId");
          const pName = r.get("personName") || "";
          const spName = r.get("spouseName");
          const fullName = spName ? `${pName} & ${spName}` : pName;

          if (!nodeMap.has(id)) {
            nodeMap.set(id, {
              id: id,
              parentId: parentId || null,
              name: fullName
            });
          } else {
            const existing = nodeMap.get(id);
            if (!existing.parentId && parentId) {
              existing.parentId = parentId;
            }
          }
        });

        const data = Array.from(nodeMap.values());

        const allIds = new Set(data.map(d => d.id));
        data.forEach(d => {
          if (d.parentId && !allIds.has(d.parentId)) {
            d.parentId = null;
          }
        });

        let rootNode = data.find(d => d.id === "1");
        if (rootNode) {
          rootNode.parentId = null;
        }

        data.forEach(d => {
          if (d.id !== "1" && d.parentId === null) {
            d.parentId = "1";
          }
        });

        if (data.length === 0) {
          statusEl.innerText = "Không tìm thấy dữ liệu phả hệ.";
          return;
        }

        // Khởi tạo đồ thị phân cấp
        new d3.OrgChart()
          .container('#tree-container')
          .data(data)
          .nodeHeight(d => 65)
          .nodeWidth(d => 210)
          .childrenMargin(d => 35)
          .compactMarginBetween(d => 20)
          .compactMarginPair(d => 25)
          .nodeContent(function(d) {
            return `
              <div class="node-card" style="width:${d.width}px; height:${d.height}px;">
                <div class="node-id">Mã: ${d.data.id}</div>
                <div class="node-title">${d.data.name}</div>
              </div>
            `;
          })
          .render()
          .expandAll();

        statusEl.style.display = "none";

      } catch (error) {
        console.error(error);
        statusEl.innerText = "Lỗi kết nối: " + error.message;
        statusEl.style.color = "red";
      } finally {
        await session.close();
        await driver.close();
      }
    }

    loadFamilyTree();
  </script>
</body>
</html>
